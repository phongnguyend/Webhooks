<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="description" content="A live inspector for incoming webhook events." />
    <title>Webhook Router</title>
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('webhook-router-theme');
          if (['system', 'light', 'dark'].includes(saved)) preference = saved;
        } catch {}
        const theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#121b18' : '#eef1ef';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
